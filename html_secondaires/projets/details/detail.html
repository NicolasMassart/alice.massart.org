<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail du projet</title>
    <link rel="stylesheet" href="../../../main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .detail-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .detail-content {
            background-color: #0f4245;
            padding: 40px;
            border-radius: 10px;
            line-height: 1.8;
        }
        .detail-content h1 {
            color: #ffffff;
            font-family: "Gulax";
            margin-bottom: 0;
            padding-bottom: 0;
            text-align: center;
            font-weight: bold;
        }
        .project-date {
            color: #ffffff;
            font-family: "Baskerville", serif;
            font-weight: 400;
            text-align: center;
            margin-top: 0 !important;

        }
        .detail-content h2 {
            color: #ffffff;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .detail-content p {
            margin: 15px 0;
        }
        .detail-content img {
            max-width: 100%;
            height: auto;
            /*margin: 20px 0;*/
            border-radius: 5px;
        }
        .detail-content a {
            color: #ffffff;
        }
        .detail-content a:hover {
            text-decoration: underline;
        }
        /* Galerie grid */
        .detail-galerie {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-flow: dense;
            gap: 8px;
            margin: 20px 0;
        }
        .detail-galerie img,
        .detail-galerie video {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .detail-galerie img:hover,
        .detail-galerie video:hover { opacity: 0.85; }
        .detail-galerie .galerie-grand {
            grid-column: span 2;
            aspect-ratio: 2 / 1;
        }
        @media (max-width: 600px) {
            .detail-galerie { grid-template-columns: repeat(2, 1fr); }
            .detail-galerie .galerie-grand { grid-column: span 2; aspect-ratio: 2 / 1; }
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        #lightbox.open { display: flex; }
        #lightbox-media {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 8px;
            object-fit: contain;
        }
        #lightbox-close {
            position: fixed;
            top: 20px;
            right: 28px;
            font-size: 36px;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
            opacity: 0.8;
            transition: opacity 0.15s;
        }
        #lightbox-close:hover { opacity: 1; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- BARRE DE NAVIGATION -->
    <nav>
        <div class="navbar">
            <a id="accueil" href="/"><img src="../../../src/img/logoHome.svg" alt="Accueil"></a>
            <div class="burger" onclick="toggleMenu()">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="menu">
                <a id="projets" href="../projets.html">Mes projets</a>
                <a id="references" href="../../references/references.html">Mes références</a>
                <a id="about" href="../../about.html">À propos</a>
            </div>
        </div>
    </nav>

    <!-- Lightbox -->
    <div id="lightbox">
        <button id="lightbox-close" onclick="closeLightbox()">×</button>
        <div id="lightbox-inner"></div>
    </div>

    <div class="detail-container">
        <a href="../projets.html" class="back-link">← Retour aux projets</a>
        <div class="detail-content" id="content">
            <p>Chargement du projet...</p>
        </div>
    </div>

    <script>
        // Récupérer les paramètres depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const media = urlParams.get('media');
        const typeMedia = urlParams.get('typeMedia');

        // Image de fond derrière le bloc
        if (media) {
            const mediaPath = `../../../src/img/${media}`;
            const bg = document.createElement('div');
            bg.id = 'detail-bg';
            bg.style.cssText = `
                position: fixed;
                inset: -10px;
                z-index: -1;
                background: url('${mediaPath}') center center / cover no-repeat;
                filter: blur(6px) brightness(0.35);
            `;
            document.body.prepend(bg);
        }

        if (slug) {
            // Charger le fichier markdown
            fetch(`${slug}.md`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Fichier non trouvé: ${slug}.md`);
                    }
                    return response.text();
                })
                .then(markdown => {
                    // Parser l'en-tête YAML-like
                    const lines = markdown.split('\n');
                    let title = '';
                    let date = '';
                    let contentStart = 0;

                    // Chercher l'en-tête
                    let bgPosition = 'center center';
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (line.startsWith('titre :')) {
                            title = line.replace('titre :', '').trim().replace(/^"|"$/g, '');
                        } else if (line.startsWith('date :')) {
                            date = line.replace('date :', '').trim().replace(/^"|"$/g, '');
                        } else if (line.startsWith('position :')) {
                            bgPosition = line.replace('position :', '').trim().replace(/^"|"$/g, '');
                        } else if (line === '' && title && date) {
                            contentStart = i + 1;
                            break;
                        }
                    }
                    if (document.getElementById('detail-bg')) {
                        document.getElementById('detail-bg').style.backgroundPosition = bgPosition;
                    }

                    // Extraire le contenu après l'en-tête
                    const contentMarkdown = lines.slice(contentStart).join('\n');

                    // Convertir le markdown en HTML
                    const html = marked.parse(contentMarkdown);

                    // Afficher titre et date
                    let headerHtml = '';
                    if (title) {
                        headerHtml += `<h1>${title}</h1>`;
                    }
                    if (date) {
                        headerHtml += `<p class="project-date">${date}</p>`;
                    }

                    const contentEl = document.getElementById('content');
                    contentEl.innerHTML = headerHtml + html;

                    // Transformer la section ## Galerie en grille d'images
                    const headings = contentEl.querySelectorAll('h2');
                    headings.forEach(h2 => {
                        if (h2.textContent.trim().toLowerCase() === 'galerie') {
                            const galerie = document.createElement('div');
                            galerie.className = 'detail-galerie';
                            let next = h2.nextElementSibling;
                            while (next) {
                                const sibling = next.nextElementSibling;
                                const medias = next.querySelectorAll('img, video');
                                if (medias.length > 0) {
                                    medias.forEach(el => galerie.appendChild(el));
                                    next.remove();
                                } else if (next.tagName === 'VIDEO') {
                                    galerie.appendChild(next);
                                } else if (next.tagName === 'H2') {
                                    break;
                                } else {
                                    next.remove();
                                }
                                next = sibling;
                            }
                            h2.replaceWith(galerie);
                        }
                    });

                    // Attacher les listeners lightbox sur chaque média de la galerie
                    document.querySelectorAll('.detail-galerie img, .detail-galerie video').forEach(el => {
                        el.addEventListener('click', () => openLightbox(el));
                    });
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = `
                        <h2>Erreur</h2>
                        <p>${error.message}</p>
                    `;
                });
        } else {
            document.getElementById('content').innerHTML = `
                <h2>Projet non spécifié</h2>
                <p>Veuillez retourner aux projets.</p>
            `;
        }

        function openLightbox(el) {
            const lb = document.getElementById('lightbox');
            const inner = document.getElementById('lightbox-inner');
            inner.innerHTML = '';
            if (el.tagName === 'VIDEO') {
                const v = document.createElement('video');
                v.src = el.src || el.querySelector('source')?.src;
                v.controls = true;
                v.autoplay = true;
                v.id = 'lightbox-media';
                inner.appendChild(v);
            } else {
                const img = document.createElement('img');
                img.src = el.src;
                img.id = 'lightbox-media';
                inner.appendChild(img);
            }
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.remove('open');
            document.getElementById('lightbox-inner').innerHTML = '';
            document.body.style.overflow = '';
        }

        document.getElementById('lightbox').addEventListener('click', e => {
            if (e.target === document.getElementById('lightbox') || e.target === document.getElementById('lightbox-inner')) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });

        function toggleMenu() {
            document.querySelector('.menu').classList.toggle('active');
        }
    </script>
</body>
</html>
